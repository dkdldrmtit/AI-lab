<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path d="M16 15v-2.5a8 8 0 0 1 16 0V15" fill="none" stroke="%231A2434" stroke-width="3.6" stroke-linecap="round"/><rect x="5" y="14" width="38" height="29" rx="7.5" fill="%231A2434"/><path d="M11 22h26" stroke="%23F5A742" stroke-width="2.8" stroke-linecap="round"/><rect x="30.6" y="23.4" width="3.6" height="6.2" rx="1.8" fill="%23F5A742"/></svg>'>
<title>행낭마켓 — 지점 간 비품 나눔 (체험판)</title>
<!-- ═══════════════════════════════════════════════════════════════
     행낭마켓 · AI Lab EXP.05 — "사이트 안의 사이트"
     실제로 작동하는 미니 사이트: 글·댓글·사진 업로드·알림·나눔온도가
     전부 브라우저(localStorage)에 저장됩니다. 서버 없음.
     다른 지점들은 가상 지점(봇)이 시간차를 두고 반응 — 전부 예시.
     행낭 하루 = 체험에서는 약 30초 (빨리감기 제공)
     디자인: 당근 앱 문법 — 흰 배경·리스트·라인 아이콘·하단 CTA 바·FAB
     ═══════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 폰트는 비차단 로딩 — CDN이 막힌 환경(사내망)에서도 흰 화면 없이 즉시 렌더 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"></noscript>
<style>
:root{
  --bg:#FFFFFF; --well:#F4F5F7; --line:#EAEBEE; --line2:#DCDEE3;
  --txt:#212124; --mut:#868B94; --faint:#ADB1BA;
  --acc:#F5A742; --accd:#B9730B; --ink:#1A2434;
  --grn:#0F8A5F; --grnbg:#EAF6F0; --red:#C2410C; --redbg:#FBEEE6;
  --hot:#E8801A; --cool:#3D8BD4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#E9EBEF;color:var(--txt);
  min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;color:var(--txt)}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
/* ── 헤더 ── */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:13px 16px;min-height:54px}
header .ttl{font-size:19px;font-weight:800;letter-spacing:-.02em}
header .beta{font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:2px 6px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.hd-me{font-size:12.5px;font-weight:700;color:var(--mut);border:none;background:none;padding:11px 6px;white-space:nowrap}
.hd-me b{color:var(--hot);font-weight:800}
.icbtn{border:none;background:none;padding:9px;min-width:40px;min-height:40px;position:relative;color:var(--txt);
  display:flex;align-items:center;justify-content:center}
.icbtn .dot{position:absolute;top:2px;right:0;min-width:15px;height:15px;border-radius:99px;background:#E5503C;
  color:#fff;font-size:9px;font-weight:800;line-height:15px;text-align:center;padding:0 4px;display:none}
.icbtn.unread .dot{display:block}
/* ── 메인 ── */
main{flex:1;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:8px;background:var(--well);border-radius:10px;
  padding:10px 12px;margin:12px 0 4px;color:var(--faint);cursor:text}
.search input{border:none;outline:none;flex:1;font-size:14px;background:none;min-width:0}
.ftabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px -16px 0;padding:0 10px}
.ftab{border:none;background:none;font-size:14px;font-weight:600;color:var(--faint);padding:11px 8px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.ftab.on{color:var(--txt);font-weight:800;border-bottom-color:var(--txt)}
.cats{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:13px;font-weight:500;
  padding:7px 13px;border-radius:99px;white-space:nowrap}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
/* 피드 — 리스트 + 구분선 */
.impact{display:flex;align-items:center;gap:9px;background:var(--well);border-radius:10px;
  padding:10px 13px;margin:10px 0 2px;font-size:12.5px;color:var(--mut);line-height:1.5}
.impact b{color:var(--txt)}
.search .xq{border:none;background:var(--line2);color:#fff;border-radius:50%;width:18px;height:18px;
  font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcard{display:flex;gap:14px;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);padding:17px 0;transition:background .15s}
.pcard:active{background:var(--well)}
.pcard.closed .pthumb{position:relative}
.pcard.closed .pthumb::after{content:'거래완료';position:absolute;inset:0;background:rgba(20,28,40,.45);
  color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:10px}
.pcard.closed .tt,.pcard.closed .qty{color:var(--mut)}
.pthumb{width:88px;height:88px;border-radius:10px;flex-shrink:0;background:var(--well);
  display:flex;align-items:center;justify-content:center;color:var(--faint);overflow:hidden;border:1px solid rgba(0,0,0,.03)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.pinfo .tt{font-size:15.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pinfo .m{font-size:12.5px;color:var(--faint);margin-top:3px}
.pinfo .qty{font-size:15px;font-weight:800;margin-top:5px}
.prow{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.bdg{font-size:11px;font-weight:700;padding:4px 8px;border-radius:5px;white-space:nowrap}
.bdg.give{background:var(--grnbg);color:var(--grn)}
.bdg.need{background:var(--redbg);color:var(--red)}
.bdg.done{background:var(--well);color:var(--mut)}
.bdg.busy{background:#FFF3E0;color:var(--accd)}
.pfoot{margin-left:auto;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px}
.pfoot .hv{color:#E5503C}
.empty{padding:52px 20px 60px;text-align:center;color:var(--mut);font-size:14px;line-height:1.8}
.empty svg{margin:0 auto 12px;opacity:.45}
.footnote{text-align:center;font-size:11px;color:var(--faint);line-height:1.7;padding:22px 10px 8px}
.footnote a{text-decoration:underline}
/* 상세 */
.dtop{display:flex;align-items:center;margin:0 -16px;padding:6px 8px;position:sticky;top:54px;background:var(--bg);z-index:5}
.hero{margin:0 -16px;background:var(--well);height:230px;display:flex;align-items:center;justify-content:center;color:var(--faint);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.seller{display:flex;align-items:center;gap:11px;padding:15px 0;border-bottom:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--well);color:var(--mut);font-size:15px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seller .nm{font-size:14.5px;font-weight:700}
.seller .sub{font-size:12px;color:var(--faint);margin-top:1px}
.seller .tw{margin-left:auto;text-align:right}
.seller .tv{font-size:15px;font-weight:800;color:var(--hot)}
.seller .tb{width:44px;height:4px;border-radius:99px;background:var(--line);margin-top:5px;margin-left:auto;overflow:hidden}
.seller .tb i{display:block;height:100%;background:var(--hot);border-radius:99px}
.dtitle{font-size:18.5px;font-weight:800;line-height:1.4;margin-top:16px}
.dmeta{font-size:12.5px;color:var(--faint);margin:7px 0 14px}
.dbody{font-size:14.5px;line-height:1.7;white-space:pre-wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
/* 진행 타임라인 — 미니멀 */
.tl{padding:16px 0;border-bottom:1px solid var(--line)}
.tl h4{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:12px}
.tls{display:flex}
.tli{flex:1;text-align:center;position:relative}
.tli .ic{display:block;width:8px;height:8px;border-radius:50%;background:var(--line2);margin:0 auto 8px;position:relative;z-index:1}
.tli.on .ic{background:var(--acc);box-shadow:0 0 0 3px #FDF0DC}
.tli span{font-size:10.5px;color:var(--faint)}
.tli.on span{color:var(--accd);font-weight:700}
.tli::before{content:'';position:absolute;top:3.5px;left:-50%;width:100%;height:1.5px;background:var(--line)}
.tli:first-child::before{display:none}
.tli.on::before{background:var(--acc)}
/* 댓글 */
h4.sec{font-size:13.5px;font-weight:800;margin:18px 0 4px}
.cm{display:flex;gap:10px;padding:11px 0}
.cm .av{width:32px;height:32px;font-size:12.5px}
.cm .bd{min-width:0}
.cm .who{font-size:12px;font-weight:700}
.cm .who span{font-weight:400;color:var(--faint);margin-left:5px}
.cm .tx{font-size:13.5px;line-height:1.55;color:var(--txt);margin-top:2px}
.cwrite{display:flex;gap:8px;margin:8px 0 14px}
.cwrite input{flex:1;border:none;background:var(--well);border-radius:10px;padding:11px 14px;font-size:13.5px;outline:none;min-width:0}
.cwrite button{border:none;border-radius:10px;background:var(--well);color:var(--mut);font-weight:700;font-size:13px;padding:0 15px}
.cwrite input:not(:placeholder-shown)~button{background:var(--acc);color:var(--ink)}
/* 하단 고정 CTA 바 (상세) */
.ctabar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px}
.ctabar .st{flex:1;min-width:0;font-size:13px;color:var(--mut);line-height:1.45;word-break:keep-all}
.ctabar .st b{color:var(--txt)}
.hbtn{border:none;background:none;padding:6px 12px 6px 2px;color:var(--faint);
  border-right:1px solid var(--line);margin-right:2px;align-self:stretch;display:flex;align-items:center}
.hbtn.on{color:#E5503C}
.btn{border:none;border-radius:10px;background:var(--acc);color:var(--ink);font-weight:800;font-size:14.5px;
  padding:13px 20px;white-space:nowrap}
.btn.line{background:var(--bg);border:1px solid var(--line2);color:var(--txt);font-weight:700}
.btn.wide{width:100%;padding:14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.thx-pick{display:flex;flex-direction:column;gap:8px;width:100%}
.thx-pick button{border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:13.5px;
  padding:12px;border-radius:10px;text-align:left}
/* 글쓰기 */
.lbl{display:block;font-size:13px;font-weight:700;color:var(--txt);margin:20px 0 8px}
.lbl em{font-style:normal;font-weight:400;color:var(--faint);font-size:12px;margin-left:4px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line2);background:var(--bg);color:var(--mut);font-weight:700;
  font-size:14px;padding:12px;border-radius:10px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--bg);color:var(--txt);font-size:13px;padding:8px 13px;border-radius:99px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.inp,textarea.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:14.5px;outline:none;background:var(--bg)}
.inp:focus{border-color:var(--txt)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.6}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.stepper button{width:40px;padding:10px 0;border:none;background:var(--well);color:var(--mut);font-size:16px;font-weight:700}
.stepper b{padding:0 16px;font-size:14px}
.photo{display:flex;gap:10px}
.photo .pv,.photo label{width:80px;height:80px;border-radius:10px;display:flex;flex-direction:column;gap:4px;
  align-items:center;justify-content:center;font-size:11px;color:var(--faint)}
.photo .pv{background:var(--well);overflow:hidden;position:relative}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo .pv .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:none;
  background:rgba(20,28,40,.75);color:#fff;font-size:10px;line-height:1}
.photo label{border:1px dashed var(--line2);cursor:pointer}
.ainote{margin-top:18px;background:var(--well);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--mut);line-height:1.6}
.ainote b{color:var(--txt)}
/* 알림 + 키워드 */
.kwbox{background:var(--well);border-radius:12px;padding:14px;margin:14px 0 6px}
.kwbox h5{font-size:12.5px;font-weight:800;margin-bottom:3px}
.kwbox .d{font-size:11.5px;color:var(--faint);line-height:1.55;margin-bottom:10px}
.kwrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.kw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  background:var(--bg);border:1px solid var(--line2);border-radius:99px;padding:7px 12px}
.kw button{border:none;background:none;color:var(--faint);font-size:11px;padding:0;line-height:1}
.kwadd{display:flex;gap:8px}
.kwadd input{flex:1;border:none;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:10px 13px;font-size:13px;outline:none;min-width:0}
.kwadd button{border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:0 15px}
.nrow{display:flex;gap:11px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
  padding:15px 2px;font-size:13.5px;line-height:1.55;color:var(--mut);align-items:flex-start}
.nrow.unread{color:var(--txt)}
.nrow .nd{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-top:6px;flex-shrink:0;opacity:0}
.nrow.unread .nd{opacity:1}
.nrow .t{font-size:11.5px;color:var(--faint);display:block;margin-top:3px}
/* 내 지점 */
.prof{padding:20px 0 16px;border-bottom:1px solid var(--line)}
.prof .top{display:flex;align-items:center;gap:13px}
.prof .av{width:54px;height:54px;font-size:20px;background:var(--acc);color:var(--ink)}
.prof h3{font-size:18px}
.prof .sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.tempw{margin-top:18px}
.tempw .row1{display:flex;align-items:baseline;justify-content:space-between}
.tempw .tv{font-size:26px;font-weight:900;color:var(--hot)}
.tempw .tl2{font-size:12px;color:var(--mut)}
.gauge{height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--hot));transition:width .6s cubic-bezier(.2,.8,.3,1)}
.gs{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px}
.tlog{margin-top:10px;font-size:12px;color:var(--faint);line-height:1.9}
.tlog b{color:var(--hot);font-weight:800;font-variant-numeric:tabular-nums;margin-right:6px}
.stats{display:flex;border:1px solid var(--line);border-radius:12px;margin:16px 0 0;overflow:hidden}
.st{flex:1;padding:13px 8px;text-align:center}
.st+.st{border-left:1px solid var(--line)}
.st b{font-size:17px;display:block}
.st span{font-size:11.5px;color:var(--mut)}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.badge{font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--well);color:var(--faint)}
.badge.got{background:#FDF0DC;color:var(--accd);font-weight:700}
.rules{font-size:12.5px;color:var(--mut);line-height:1.75;padding:16px 0;border-bottom:1px solid var(--line)}
.rules b{color:var(--txt)}
.card-t{border-bottom:1px solid var(--line);padding:13px 2px;font-size:13.5px;line-height:1.6}
.card-t .who{font-size:11.5px;color:var(--faint);margin-top:3px}
.txtbtn{border:none;background:none;color:var(--faint);font-size:12.5px;text-decoration:underline;padding:14px 0;display:block;margin:0 auto}
/* AI 매칭 추천 카드 */
.aim{margin-top:14px;border:1px solid var(--line2);border-radius:12px;padding:14px;background:var(--well)}
.aim .tag{font-size:11px;font-weight:800;color:var(--accd);margin-bottom:7px;letter-spacing:.02em}
.aim .tt{font-size:14px;font-weight:700}
.aim .tt span{color:var(--faint);font-weight:400;font-size:12.5px}
.aim .rs{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.55}
/* 하단 내비 + FAB */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:28;
  background:var(--bg);border-top:1px solid var(--line);display:flex;
  padding:5px 8px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;border:none;background:none;color:var(--faint);font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;gap:4px;align-items:center;padding:7px 0;position:relative}
nav button.on{color:var(--txt);font-weight:700}
nav button .nd{position:absolute;top:5px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:#E5503C;display:none}
nav button.unread .nd{display:block}
#fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:29;
  border:none;border-radius:99px;background:var(--acc);color:var(--ink);font-weight:800;font-size:14px;
  padding:14px 19px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(245,167,66,.45)}
/* 빨리감기 + 토스트 */
#ff{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:max(16px,calc(50% - 244px));z-index:29;
  border:none;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;
  padding:12px 16px;box-shadow:0 6px 18px rgba(20,28,40,.3);display:none;align-items:center;gap:6px}
#ff.show{display:inline-flex}
body.haspost #ff{bottom:calc(150px + env(safe-area-inset-bottom))}   /* 상세의 CTA 바를 피해서 */
body.haswrite #ff{display:none!important}                            /* 글쓰기 화면에선 숨김 */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-130px);z-index:60;max-width:86%;
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;border-radius:11px;padding:12px 17px;
  transition:transform .35s cubic-bezier(.2,.8,.3,1);line-height:1.5;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast b{color:var(--acc)}
/* 온보딩 */
#onb{position:fixed;inset:0;z-index:50;background:rgba(22,32,46,.45);display:flex;align-items:flex-end;justify-content:center}
#onb[hidden]{display:none}
#onb .sheet{width:100%;max-width:520px;background:var(--bg);border-radius:20px 20px 0 0;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
#onb h2{font-size:20px;margin-bottom:8px;letter-spacing:-.02em}
#onb p{font-size:13.5px;color:var(--mut);line-height:1.7}
.brlist{margin:18px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brlist button{display:flex;align-items:center;width:100%;border:none;background:var(--bg);padding:14px 16px;
  font-size:14.5px;font-weight:600;color:var(--txt);text-align:left}
.brlist button+button{border-top:1px solid var(--line)}
.brlist button .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2)}
.brlist button.on .ck{border-color:var(--acc);background:var(--acc)}
.fine{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:12px}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.chip:active,.cat:active,.seg button:active,.ftab:active{opacity:.6}
nav button:active,.icbtn:active{opacity:.55}
.nrow:active,.brlist button:active,.thx-pick button:active{background:var(--well)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.vin{animation:vin .18s ease}
.guide{background:var(--well);border-radius:12px;padding:13px 34px 13px 15px;margin:12px 0 2px;
  font-size:12.5px;color:var(--mut);line-height:1.7;position:relative}
.guide b{color:var(--txt)}
.guide .gx{position:absolute;top:6px;right:6px;border:none;background:none;color:var(--faint);font-size:12px;padding:7px}
.dtop .del{margin-left:auto;border:none;background:none;color:var(--faint);font-size:12.5px;
  padding:9px 10px;text-decoration:underline}
.linkchip{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:10px 16px;
  font-size:12.5px;font-weight:600;color:var(--mut);margin-top:16px}
.gs{position:relative}
#view>.footnote:last-of-type{margin-bottom:52px}   /* FAB가 정직 라벨을 가리지 않게 */
</style>
</head>
<body>
<div id="app">
  <header>
    <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 15v-2.5a8 8 0 0 1 16 0V15" fill="none" stroke="#1A2434" stroke-width="3.6" stroke-linecap="round"/><rect x="5" y="14" width="38" height="29" rx="7.5" fill="#1A2434"/><path d="M11 22h26" stroke="#F5A742" stroke-width="2.8" stroke-linecap="round"/><rect x="30.6" y="23.4" width="3.6" height="6.2" rx="1.8" fill="#F5A742"/></svg><span class="ttl">행낭마켓</span><span class="beta">체험판</span>
    <div class="hd-r">
      <button class="hd-me" id="meChip">지점 선택</button>
      <button class="icbtn" id="bell" aria-label="알림"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav>
    <button data-r="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>홈</button>
    <button data-r="noti" id="navNoti"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>알림<span class="nd"></span></button>
    <button data-r="my"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"/><path d="M2 21h20"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15"/></svg>내 지점</button>
  </nav>
  <button id="fab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>글쓰기</button>
  <button id="ff">행낭 빨리감기 <span id="ffn"></span></button>
  <div id="toast" role="status"></div>

  <div id="onb" hidden>
    <div class="sheet">
      <svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 15v-2.5a8 8 0 0 1 16 0V15" fill="none" stroke="#1A2434" stroke-width="3.6" stroke-linecap="round"/><rect x="5" y="14" width="38" height="29" rx="7.5" fill="#1A2434"/><path d="M11 22h26" stroke="#F5A742" stroke-width="2.8" stroke-linecap="round"/><rect x="30.6" y="23.4" width="3.6" height="6.2" rx="1.8" fill="#F5A742"/></svg>
      <h2 style="margin-top:10px">행낭마켓 시작하기</h2>
      <p>당근마켓처럼, 지점끼리 남는 비품을 나누는 곳이에요. 배송은 매일 도는 <b>행낭</b>이 대신합니다.<br>
        먼저 내 지점을 골라주세요.</p>
      <div class="brlist" id="brPick"></div>
      <button class="btn wide" id="onbGo" disabled>이 지점으로 시작</button>
      <p class="fine">지점·글·온도는 전부 가상 예시(실존 동명 지점과 무관)이며, 데이터는 이 브라우저에만 저장됩니다(서버 없음).
        다른 지점들은 가상 지점이 시간차로 반응하고, 행낭 하루는 체험에서 약 30초입니다.</p>
    </div>
  </div>
</div>

<script>
'use strict';
/* ═══ 행낭마켓 미니 사이트 — 전부 클라이언트, localStorage 저장, 가상 지점 봇 ═══ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T0=36.5, TMAX=45.5, KEY='hnm-v2';
const HN_API='https://wandering-dust-9ae8.dkdldrmtit-d5e.workers.dev/';   /* 건배사와 같은 Worker — hn 라우트 */
const DAY_MS=30_000;                 /* 행낭 하루 = 30초 (체험 축약) */
const CATS=[['클립·집게','통'],['바인더','권'],['토너','개'],['봉투·전표','묶음'],['판촉물','장'],['필기구','자루']];
const MY_CHOICES=['성수지점','종로지점','해운대지점','전주지점'];
const BOTS=[
  {n:'여의도지점',t:41.2},{n:'마포지점',t:40.4},{n:'부평지점',t:39.8},
  {n:'판교지점',t:39.1},{n:'강서지점',t:38.6},{n:'동탄지점',t:37.8}];
const THX=['따뜻하게 잘 쓰겠습니다','급한 불 꺼주셔서 감사합니다','최고의 이웃 지점입니다','덕분에 주문 없이 해결했어요'];
const IC_PKG='<svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 15v-2.5a8 8 0 0 1 16 0V15"/><rect x="5.5" y="14.5" width="37" height="28" rx="7"/><path d="M11 22h26"/><path d="M31 22v4.5"/></svg>';
const IC_CAM='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3v13H4V7Z"/><circle cx="12" cy="13" r="3.4"/></svg>';
const IC_SRCH='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>';
const IC_BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>';
const IC_FF='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l8-7-8-7Zm9 0v14l8-7-8-7Z"/></svg>';
const IC_HEART=on=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.5S3.5 15.4 3.5 9.6C3.5 6.8 5.7 4.5 8.4 4.5c1.5 0 2.8.7 3.6 1.8.8-1.1 2.1-1.8 3.6-1.8 2.7 0 4.9 2.3 4.9 5.1 0 5.8-8.5 10.9-8.5 10.9Z"/></svg>`;
/* 가상 지점이 올리는 신규 글 풀 — 피드가 계속 살아있게 (전부 예시) */
const BOT_POSTS=[
  {kind:'give',cat:1,qty:10,title:'3공 바인더 10권 나눔해요',desc:'창고 정리에서 새 바인더가 나왔습니다. 필요하신 지점 신청해 주세요.'},
  {kind:'need',cat:3,qty:3,title:'A4 서류봉투(중) 3묶음 구합니다',desc:'재고가 바닥났어요. 여분 있으신 지점 부탁드립니다.'},
  {kind:'give',cat:5,qty:20,title:'형광펜 세트 20개 나눔해요',desc:'판촉 행사 여분입니다. 전부 새 제품이에요.'},
  {kind:'need',cat:0,qty:3,title:'집게 클립(중) 급하게 찾습니다',desc:'월말 서류 정리에 수량이 모자랍니다.'},
  {kind:'give',cat:3,qty:2,title:'창구 전표 2박스 나눔',desc:'양식 변경으로 여분이 생겼어요. 다음 행낭 편에 실어 드립니다.'},
  {kind:'need',cat:5,qty:12,title:'네임펜 여분 있으실까요',desc:'행사 준비 중인데 수량이 부족합니다.'},
  {kind:'give',cat:0,qty:2,title:'대형 클립 2통 나눔해요',desc:'서랍 정리하다 새 제품이 나왔어요. 필요하신 지점은 신청 주세요.'},
  {kind:'give',cat:4,qty:60,title:'볼펜 판촉물 60자루 나눔',desc:'행사 뒤 남았습니다. 나눠 가실 지점 찾아요.'},
  {kind:'give',cat:2,qty:1,title:'레이저 토너 여분 1개 나눔해요',desc:'프린터 교체로 새 토너가 남았습니다. 모델 확인 후 신청해 주세요.'}];

/* ── 상태 ── */
let DB=null;
const now=()=>Date.now();
const load=()=>{try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||!DB.v){DB=seed()}
  /* 기존 사용자 마이그레이션 — 새 필드 기본값 */
  DB.favs=DB.favs||[];DB.kw=DB.kw||[];DB.tlog=DB.tlog||[];DB.bpi=DB.bpi||0; };
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){
  try{const slim=Object.assign({},DB,{posts:DB.posts.map(p=>p.img?Object.assign({},p,{img:null}):p)});
    localStorage.setItem(KEY,JSON.stringify(slim));toast('저장 공간이 가득 차 사진을 빼고 저장했어요');}
  catch(e2){toast('저장 공간이 가득 차 저장하지 못했어요 — 오래된 글을 지워주세요');}}};
function seed(){
  const t=now();
  const mk=(min,o)=>Object.assign({id:'s'+min,ts:t-min*60000,comments:[],state:'open',img:null,qty:1,desc:''},o);
  return {v:2,me:null,temp:T0,sent:0,recv:0,thx:0,noti:[],events:[],
    posts:[
      mk(10,{br:'여의도지점',kind:'give',cat:0,title:'대형 더블클립 3통 나눔해요',qty:3,
        desc:'연말 정리하다 보니 새 제품 3통이 나왔어요.\n필요하신 지점은 아래 버튼으로 신청해 주세요 — 다음 행낭 편에 실어 보내드립니다.'}),
      mk(70,{br:'동탄지점',kind:'need',cat:2,title:'HP 토너 CF280A 급히 구합니다',
        desc:'프린터가 하필 월말에 바닥났습니다. 여분 있으신 지점 계실까요?'}),
      mk(200,{br:'부평지점',kind:'give',cat:4,title:'명절 판촉 쇼핑백 120장 남았습니다',qty:120,
        desc:'행사 끝나고 박스째 남았어요. 나눠 가실 지점 찾습니다.'}),
      mk(1500,{br:'마포지점',kind:'give',cat:3,title:'서류봉투(대) 5묶음 나눔 완료',qty:5,state:'closed',
        desc:'강서지점에 잘 전달됐습니다. 다들 행낭마켓 하세요.',
        comments:[{br:'강서지점',txt:'다음날 바로 도착했어요. 감사합니다!',ts:t-1440*60000}]}),
    ]};
}
const meBr=()=>DB.me;
const isMine=p=>p.br===DB.me;
const post=id=>DB.posts.find(p=>p.id===id);
const botOf=n=>BOTS.find(b=>b.n===n);
const catU=p=>CATS[p.cat][1];

/* ── 공용 UI ── */
let toastT=null;
function toast(msg){const el=$('#toast');el.innerHTML=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600);}
function noti(txt,link){DB.noti.unshift({txt,link:link||null,ts:now(),read:false});paintBell();}
function paintBell(){const c=DB.noti.filter(n=>!n.read).length;
  $('#bell').classList.toggle('unread',c>0);$('#navNoti').classList.toggle('unread',c>0);
  $('#bell .dot').textContent=c>9?'9+':(c||'');}
function ago(ts){const m=Math.floor((now()-ts)/60000);
  if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.floor(m/60);
  if(h<24)return h+'시간 전';return Math.floor(h/24)+'일 전';}
const fmtT=v=>v.toFixed(1)+'°';
function bump(dv,why){DB.temp=Math.round((DB.temp+dv)*10)/10;
  DB.tlog.unshift({dv,why,ts:now()});if(DB.tlog.length>20)DB.tlog.length=20;
  toast(`나눔온도 <b>${fmtT(DB.temp)}</b> (+${dv.toFixed(1)}°) — ${why}`);}

/* ── 이벤트(봇·행낭 타이머) — 재방문에도 이어짐 ── */
function sched(delay,type,pid,data){DB.events.push({at:now()+delay,type,pid,data:data||null});paintFF();}
function tick(){
  const t=now();
  const due=DB.events.filter(e=>e.at<=t);
  if(!due.length){paintFF();return;}
  DB.events=DB.events.filter(e=>e.at>t);
  due.sort((a,b)=>a.at-b.at).forEach(run);
  save();
  const r=(location.hash||'#home').slice(1).split('/')[0];
  if(r==='write'){paintMe();paintBell();}else render();   /* 글쓰기 중엔 드래프트 보호 — 재렌더 금지 */
  paintFF();
}
function paintFF(){const n=DB.events.filter(e=>e.type!=='botPost').length;
  $('#ff').classList.toggle('show',n>0);$('#ffn').textContent=n?`(${n})`:'';}
function ensureBotPost(){if(DB.me&&!DB.events.some(e=>e.type==='botPost'))
  sched(35000+Math.random()*35000,'botPost',null);}
function run(ev){
  if(ev.type==='botPost'){                      /* 가상 지점의 신규 글 — 피드가 계속 살아있게 */
    const tp=BOT_POSTS[DB.bpi%BOT_POSTS.length];DB.bpi++;
    const br=BOTS[Math.floor(Math.random()*BOTS.length)].n;
    const np=Object.assign({id:'b'+now(),br,ts:now(),state:'open',comments:[],img:null,peer:null},tp);
    DB.posts.unshift(np);
    DB.kw.forEach(k=>{if(np.title.includes(k))
      noti(`키워드 "${esc(k)}" 새 글 — ${esc(np.title)} (${br})`,'post/'+np.id);});
    if(DB.posts.length>36){                     /* 오래된 완료 글부터 정리 */
      const old=[...DB.posts].reverse().find(x=>x.state==='closed'&&!isMine(x));
      if(old){DB.posts=DB.posts.filter(x=>x.id!==old.id);DB.favs=DB.favs.filter(f=>f!==old.id);}}
    sched(45000+Math.random()*45000,'botPost',null);
    return;}
  const p=post(ev.pid);if(!p)return;
  const B=ev.data&&ev.data.bot?ev.data.bot:'여의도지점';
  switch(ev.type){
    case 'botAsk':{
      if(p.state!=='open')break;
      p.comments.push({br:B,txt:'저희 지점에 꼭 필요합니다. 신청드려요.',ts:now(),ask:true});
      noti(`${B}이 "${esc(p.title)}"에 신청했습니다 — 보낼 지점을 골라주세요`,'post/'+p.id);
      break;}
    case 'botOffer':{
      if(p.state!=='open')break;
      p.state='promisedIn';p.peer=B;
      p.comments.push({br:B,txt:'저희 창고에 여분 있어요. 다음 행낭 편에 실어 보낼게요.',ts:now()});
      noti(`${B}이 "${esc(p.title)}"를 보내주기로 했습니다 — 행낭을 기다려 보세요`,'post/'+p.id);
      sched(DAY_MS,'arriveIn',p.id,{bot:B});
      break;}
    case 'botAccept':{
      if(p.state!=='open')break;
      p.state='shippedIn';
      p.comments.push({br:p.br,txt:`${meBr()} 수신 확정입니다. 내일 아침 행낭에 실어 보냅니다. (체험에서는 약 30초)`,ts:now()});
      noti(`${p.br}이 수신처를 우리 지점으로 확정 — 행낭 이동 중`,'post/'+p.id);
      sched(DAY_MS,'arriveIn',p.id,{bot:p.br});
      break;}
    case 'arriveIn':{
      if(p.state!=='shippedIn'&&p.state!=='promisedIn')break;
      p.state='arrived';
      noti(`아침 행낭 도착 — "${esc(p.title)}" 수령 확인을 눌러주세요`,'post/'+p.id);
      break;}
    case 'shipOut':{
      if(p.state!=='shippedOut')break;
      p.state='closed';DB.sent++;
      const b=botOf(p.peer);if(b)b.t=Math.round((b.t+0.2)*10)/10;
      bump(0.2,'상대 지점 수령 확인');
      p.comments.push({br:p.peer,txt:THX[Math.floor(Math.random()*THX.length)]+' (감사 카드)',ts:now()});
      DB.thx++;setTimeout(()=>{bump(0.1,'감사 카드 도착');save();render();},700);
      noti(`${p.peer}이 "${esc(p.title)}" 수령을 확인했습니다 (+0.2°) · 감사 카드 도착 (+0.1°)`,'post/'+p.id);
      break;}

function go(r){location.hash='#'+r}
function goBack(){if(history.length>1)history.back();else go('home');}
let _prevR='',homeScroll=0;
function route(){
  const h=(location.hash||'#home').slice(1);
  let [r,arg]=h.split('/');
  if(!r)r='home';
  if(r==='post'&&!post(arg))r='home';         /* 없는 글 딥링크 → 홈으로 정규화 */
  if(_prevR==='home')homeScroll=window.scrollY;
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===(r==='post'?'home':r==='write'?'home':r)));
  $('#fab').style.display=(r==='home')?'flex':'none';
  document.body.classList.toggle('haspost',r==='post');
  document.body.classList.toggle('haswrite',r==='write');
  const V=$('#view');
  if(!DB.me){V.innerHTML='';return;}
  if(r==='post'){const pp=post(arg);
    if(window._lastView!==arg){window._lastView=arg;pp.views=(pp.views||0)+1;save();}
    V.innerHTML=vPost(pp);}
  else if(r==='write')V.innerHTML=vWrite();
  else if(r==='noti'){V.innerHTML=vNoti();DB.noti.forEach(n=>n.read=true);save();paintBell();}
  else if(r==='my')V.innerHTML=vMy();
  else V.innerHTML=vHome();
  if(r!==_prevR){V.classList.remove('vin');void V.offsetWidth;V.classList.add('vin');}
  window.scrollTo(0,r==='home'?homeScroll:0);  /* 피드 훑던 자리로 복귀 */
  _prevR=r;
  if(r==='write')bindWrite();
}
window.addEventListener('hashchange',route);
function render(){                              /* 재렌더 시 입력 중 텍스트·커서 보존 */

  paintMe();route();

    if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
}

function tlHTML(p){
  const steps=['등록','매칭','행낭 이동','수령','감사'];
  const idx=p.state==='open'?0:(p.state==='matchedOut'||p.state==='promisedIn')?1:
    p.state.startsWith('shipped')?2:p.state==='arrived'?3:p.state==='thanks'?3:p.state==='closed'?4:1;
  return `<div class="tl"><h4>나눔 진행 — 배송은 매일 도는 행낭이 맡아요 (배송비 0원)</h4><div class="tls">${
    steps.map((s,i)=>`<div class="tli${i<=idx?' on':''}"><span class="ic"></span><span>${s}</span></div>`).join('')}</div></div>`;
}
function ctaHTML(p){
  const B=(a,t,line)=>`<button class="btn${line?' line':''}" data-${a}="${p.id}">${t}</button>`;
  const fav=DB.favs.includes(p.id);
  const hb=isMine(p)?'':`<button class="hbtn${fav?' on':''}" data-fav="${p.id}" aria-label="관심" aria-pressed="${fav}">${IC_HEART(fav)}</button>`;
  const bar=(st,btns)=>`<div class="ctabar">${hb}<div class="st">${st}</div>${btns||''}</div>`;
  if(p.state==='closed')return bar('나눔이 완료된 글이에요');
  if(isMine(p)){
    const bump=(p.state==='open'&&now()-p.ts>DAY_MS&&!DB.events.some(e=>e.pid===p.id))?B('bump','끌어올리기',1):'';
    if(p.state==='open'&&p.kind==='give'){
      const asks=p.comments.filter(c=>c.ask);
      return asks.length?bar('신청한 지점 중 <b>보낼 곳</b>을 골라주세요',
          asks.map(a=>`<button class="btn" data-send="${p.id}" data-to="${a.br}">${a.br}에 보내기</button>`).join(''))
        :bar('다른 지점의 신청을 기다리는 중 — 가상 지점이 곧 반응합니다',bump);
    }
    if(p.state==='open'&&p.kind==='need')return bar('보내줄 지점을 기다리는 중 — 가상 지점이 곧 반응합니다',bump);
    if(p.state==='matchedOut')return bar(`<b>${p.peer}</b> 수신 확정`,B('ship','행낭 발송 등록'));
    if(p.state==='shippedOut')return bar(`행낭 이동 중 — <b>${p.peer}</b> 도착까지 잠시 (빨리감기 가능)`);
    if(p.state==='promisedIn'||p.state==='shippedIn')return bar(`<b>${p.peer||'상대 지점'}</b>이 보낸 행낭이 이동 중 (빨리감기 가능)`);
    if(p.state==='arrived')return bar('행낭이 도착했습니다',B('recv','수령 확인 (+0.2°)'));
  }else{
    if(p.state==='open'&&p.kind==='give'){
      if(p.comments.some(c=>c.ask&&c.br===meBr()))return bar(`신청 완료 — <b>${p.br}</b>의 확정을 기다리는 중 (빨리감기 가능)`);
      return bar(`${p.br}의 나눔<br>지금 신청하면 다음 행낭 편`,B('ask','저희 지점 필요해요'));}
    if(p.state==='open'&&p.kind==='need')return bar(`${p.br}이 찾는 중<br>여분이 있다면 행낭에 실어주세요`,B('offer','저희가 보내드릴게요'));
    if(p.state==='shippedIn')return bar('행낭 이동 중 — 내일 아침 도착 (빨리감기 가능)');
    if(p.state==='arrived')return bar('행낭이 도착했습니다',B('recv','수령 확인 (+0.2°)'));
    if(p.state==='matchedOut'&&p.sender===meBr())return bar(`<b>${p.br}</b>으로 보낼 준비 완료`,B('ship','행낭 발송 등록'));
    if(p.state==='shippedOut'&&p.sender===meBr())return bar(`행낭 이동 중 — <b>${p.br}</b> 도착까지 잠시 (빨리감기 가능)`);
    if(p.state==='matchedOut'||p.state==='shippedOut'||p.state==='promisedIn')return bar('다른 지점과 진행 중인 나눔입니다');
  }
  return '';
}

let aiBusy=false;
async function aiDraft(){                       /* 실제 Claude — 사진 비전 + 글 작성 */
  if(aiBusy)return;
  const btn=$('#wAuto');aiBusy=true;btn.disabled=true;
  const old=btn.textContent;
  btn.textContent=wImg?'Claude가 사진을 보는 중':'Claude가 쓰는 중';
  try{
    const r=await fetch(HN_API,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({hn:'draft',kind:wKind,cat:wCat,qty:wQty,hint:$('#wTitle').value.trim(),img:wImg||''})});
    const d=await r.json();
    if(d.error==='cooldown'){toast('잠깐만요 — 5초 뒤 다시 눌러주세요');return;}
    if(d.error==='not_supply'){toast('Claude: 사진이 사무 비품으로 보이지 않아요 — 직접 입력해 주세요');return;}
    if(!d.title)throw 0;
    if(typeof d.cat==='number'&&d.cat!==wCat){wCat=d.cat;
      $$('#wCat .chip').forEach(b=>b.classList.toggle('on',+b.dataset.c===wCat));}
    if(d.qty){wQty=d.qty;}

    wTitleV=d.title;$('#wTitle').value=d.title;
    if(d.desc){wDescV=d.desc;$('#wDesc').value=d.desc;}
    toast('Claude가 작성했어요 — 확인하고 등록해 주세요');
  }catch(e){
    if(!$('#wTitle').value.trim()){wTitleV=autoTitle();$('#wTitle').value=wTitleV;
      toast('AI 연결 실패 — 제목만 기본 문구로 채웠어요. 확인하고 고쳐주세요');}
    else toast('AI 연결 실패 — 입력하신 내용은 그대로 두었어요');
  }finally{aiBusy=false;btn.disabled=false;btn.textContent=old;}
}
function aiMatch(p){                            /* 실제 Claude — 반대편 글 매칭 추천 */
  const cands=DB.posts.filter(x=>x.id!==p.id&&!isMine(x)&&x.state==='open'&&x.kind!==p.kind)
    .map(x=>({id:x.id,kind:x.kind,title:x.title}));
  if(!cands.length)return;
  fetch(HN_API,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({hn:'match',kind:p.kind,title:p.title,cands})})
   .then(r=>r.json()).then(d=>{
     if(!d||!d.match)return;
     const tgt=post(d.match);if(!tgt)return;
     p.aiMatch={id:d.match,reason:d.reason||''};
     noti(`Claude 매칭 — "${esc(p.title)}"와 맞는 글을 찾았어요: ${esc(tgt.title)} (${tgt.br})`,'post/'+p.id);
     save();render();
   }).catch(()=>{});
}

      wImg=c.toDataURL('image/jpeg',.78);
      const pv=$('#wPv');pv.hidden=false;
      pv.innerHTML=`<img src="${wImg}"><button class="x" id="wPvX">✕</button>`;
      const lb=$('label[for="wFile"]');if(lb)lb.innerHTML=IC_CAM+'사진 바꾸기';
    };img.src=rd.result;};
    rd.readAsDataURL(f);
  });
}
function submitPost(){
  const title=$('#wTitle').value.trim()||autoTitle();
  const p={id:'p'+now(),br:meBr(),kind:wKind,cat:wCat,qty:wQty,title,desc:$('#wDesc').value.trim(),
    img:wImg,ts:now(),state:'open',comments:[],peer:null};
  DB.posts.unshift(p);
  const bots=[...BOTS].sort(()=>Math.random()-.5);
  if(wKind==='give'){
    sched(7000+Math.random()*8000,'botAsk',p.id,{bot:bots[0].n});
    if(Math.random()<.6)sched(16000+Math.random()*9000,'botAsk',p.id,{bot:bots[1].n});
  }else{
    sched(8000+Math.random()*9000,'botOffer',p.id,{bot:bots[0].n});
  }
  wImg=null;wTitleV='';wDescV='';
  save();toast('등록 완료 — 가상 지점들이 곧 반응합니다');go('post/'+p.id);
  aiMatch(p);                                   /* Claude가 반대편 글과 매칭 시도 */
}

/* ── 뷰: 알림 ── */
function vNoti(){
  return `<h4 class="sec" style="margin-top:16px">알림</h4>
  <div class="kwbox"><h5>키워드 알림</h5>
    <div class="d">등록한 키워드가 들어간 새 글이 올라오면 알려드려요 — 예: 토너, 클립</div>
    ${DB.kw.length?`<div class="kwrow">${DB.kw.map(k=>
      `<span class="kw">${esc(k)}<button data-kwx="${esc(k)}" aria-label="${esc(k)} 삭제">✕</button></span>`).join('')}</div>`:''}
    <div class="kwadd"><input id="kwIn" placeholder="키워드 추가" maxlength="12" autocomplete="off"><button id="kwGo">등록</button></div>
  </div>
  ${DB.noti.length?DB.noti.map(n=>`<button class="nrow${n.read?'':' unread'}"
      ${n.link?`data-open-r="${n.link}"`:''}><span class="nd"></span><span>${n.txt}<span class="t">${ago(n.ts)}</span></span></button>`).join('')
    :'<div class="empty">아직 알림이 없어요.<br>글을 올리거나 신청하면 가상 지점들이 반응합니다.</div>'}
  <div class="footnote">알림·지점 전부 가상 예시 · 실제 시스템 아님</div>`;
}

/* ── 뷰: 내 지점 ── */
function vMy(){
  const B=[['첫 나눔',DB.sent>0],['첫 받음',DB.recv>0],['온기 37°',DB.temp>=37],['감사 수집가',DB.thx>=2],['단골 이웃',DB.sent+DB.recv>=3]];
  const myPosts=DB.posts.filter(isMine);
  const cards=DB.posts.flatMap(p=>p.comments.filter(c=>c.txt.includes('감사 카드')&&isMine(p)).map(c=>({c,p})));
  const pct=Math.min(100,Math.max(4,(DB.temp-T0)/(TMAX-T0)*100));
  return `<div class="prof">
    <div class="top"><span class="av">${meBr()[0]}</span>
      <div><h3>${meBr()}</h3><div class="sub">행낭마켓 체험 중 · 내 글 ${myPosts.length}</div></div></div>
    <div class="tempw">
      <div class="row1"><span class="tv">${fmtT(DB.temp)}</span><span class="tl2">나눔온도</span></div>
      <div class="gauge"><i style="width:${pct}%"></i></div>
      <div class="gs"><span>36.5°</span><span style="position:absolute;left:41.2%">40°</span><span>45°+</span></div>
      ${DB.tlog.length?`<div class="tlog">${DB.tlog.slice(0,3).map(l=>
        `<div><b>+${l.dv.toFixed(1)}°</b>${esc(l.why)} · ${ago(l.ts)}</div>`).join('')}</div>`:''}
    </div>
    <div class="stats"><div class="st"><b>${DB.sent}</b><span>나눔</span></div>
      <div class="st"><b>${DB.recv}</b><span>받음</span></div>
      <div class="st"><b>${DB.thx}</b><span>감사 카드</span></div></div>
    <div class="badges">${B.map(([n,ok])=>`<span class="badge${ok?' got':''}">${n}</span>`).join('')}</div>
  </div>
  <div class="rules"><b>나눔온도 규칙(안)</b> — 모든 지점 36.5°에서 시작 · 수령 확인 +0.2° · 감사 카드 +0.1° ·
    매칭 후 미발송 −0.5° · 배송은 매일 도는 행낭이 담당(배송비 0원 · 물류 신설 없음)</div>
  ${cards.length?`<h4 class="sec">받은 감사 카드</h4>${cards.map(({c,p})=>
    `<div class="card-t">“${esc(c.txt.replace(' (감사 카드)',''))}”<div class="who">${c.br} · ${esc(p.title)}</div></div>`).join('')}`:''}
  ${(()=>{const favs=DB.favs.map(post).filter(Boolean);
    return favs.length?`<h4 class="sec">관심 목록 <span style="color:#E5503C">♥</span> ${favs.length}</h4>${favs.map(cardHTML).join('')}`:''})()}
  ${myPosts.length?`<h4 class="sec">내가 쓴 글</h4>${myPosts.map(cardHTML).join('')}`:''}
  <div style="text-align:center"><a class="linkchip" href="index.html#project/hn">AI Lab에서 이 아이디어 보기 →</a></div>
  <button class="txtbtn" id="resetAll">체험 초기화 — 모든 데이터 삭제</button>
  <div class="footnote">AI Lab의 아이디어 체험판 · 지점·온도 전부 가상 예시 · 데이터는 이 브라우저에만 저장</div>`;
}

/* ── 온보딩 ── */
let pickBr=null;
function onboard(){
  $('#brPick').innerHTML=MY_CHOICES.map(b=>`<button data-b="${b}">${b}<span class="ck"></span></button>`).join('');
  $('#onb').hidden=false;
  $('#brPick').addEventListener('click',e=>{
    const b=e.target.closest('[data-b]');if(!b)return;
    pickBr=b.dataset.b;
    $$('#brPick button').forEach(x=>x.classList.toggle('on',x===b));
    $('#onbGo').disabled=false;
  });
  $('#onbGo').addEventListener('click',()=>{
    DB.me=pickBr;ensureBotPost();save();$('#onb').hidden=true;paintMe();route();
    toast(`${pickBr}으로 시작합니다 — 피드의 글에 신청하거나 첫 글을 올려보세요`);
  });
}
function paintMe(){$('#meChip').innerHTML=DB.me?`${DB.me} <b>${fmtT(DB.temp)}</b>`:'지점 선택';}

/* ── 전역 클릭 ── */
document.addEventListener('click',e=>{
  const nv=e.target.closest('nav button');if(nv){go(nv.dataset.r);return;}
  if(e.target.closest('#bell')){go('noti');return;}
  if(e.target.closest('#meChip')){go('my');return;}
  if(e.target.closest('#fab')){go('write');return;}
  const op=e.target.closest('[data-open]');if(op){go('post/'+op.dataset.open);return;}
  const onr=e.target.closest('[data-open-r]');if(onr){go(onr.dataset.openR);return;}
  const t=e.target;
  if(t.dataset.fk){fKind=t.dataset.fk;render();return;}
  if(t.dataset.fc){fCat=+t.dataset.fc;render();return;}
  if(t.closest('#wKind [data-k]')){wKind=t.closest('[data-k]').dataset.k;   /* 재렌더 없이 토글 — 드래프트 보호 */
    $$('#wKind button').forEach(b=>b.classList.toggle('on',b.dataset.k===wKind));
    const ti=$('#wTitle');if(ti)ti.placeholder='예: '+autoTitle();return;}
  if(t.closest('#wCat [data-c]')){wCat=+t.closest('[data-c]').dataset.c;
    $$('#wCat .chip').forEach(b=>b.classList.toggle('on',+b.dataset.c===wCat));
    const qv=$('#wQv');if(qv)qv.textContent=wQty+CATS[wCat][1];
    const ti=$('#wTitle');if(ti)ti.placeholder='예: '+autoTitle();return;}
  if(t.id==='wQm'||t.id==='wQp'){wQty=Math.min(999,Math.max(1,wQty+(t.id==='wQp'?1:-1)));$('#wQv').textContent=wQty+CATS[wCat][1];return;}
  if(t.id==='wAuto'){aiDraft();return;}
  if(t.id==='wGo'){submitPost();return;}
  if(t.id==='wPvX'){wImg=null;const pv=$('#wPv');pv.hidden=true;pv.innerHTML='';
    const lb=$('label[for="wFile"]');if(lb)lb.innerHTML=IC_CAM+'사진 추가';return;}
  if(t.id==='qClear'){fQ='';render();return;}
  if(t.id==='gx'){DB.guide=1;save();render();return;}
  const kwa=t.closest('[data-kwadd]');if(kwa){const v=kwa.dataset.kwadd.trim();
    if(v&&!DB.kw.includes(v)&&DB.kw.length<5){DB.kw.push(v);save();
      toast(`키워드 "<b>${esc(v)}</b>" 등록 — 새 글이 올라오면 알려드려요`);render();}return;}
  const del=t.closest('[data-del]');if(del){
    if(!confirm('이 글을 삭제할까요?'))return;
    const id=del.dataset.del;
    DB.posts=DB.posts.filter(x=>x.id!==id);
    DB.events=DB.events.filter(e=>e.pid!==id);
    DB.favs=DB.favs.filter(f=>f!==id);
    save();go('home');toast('글을 삭제했어요');return;}
  if(t.id==='kwGo'){const v=$('#kwIn').value.trim();
    if(!v)return;
    if(DB.kw.includes(v)){toast('이미 등록된 키워드예요');return;}
    if(DB.kw.length>=5){toast('키워드는 5개까지 등록할 수 있어요');return;}
    DB.kw.push(v);save();render();toast(`키워드 "<b>${esc(v)}</b>" 등록 — 새 글이 올라오면 알려드려요`);return;}
  const kwx=t.closest('[data-kwx]');if(kwx){DB.kw=DB.kw.filter(k=>k!==kwx.dataset.kwx);save();render();return;}
  const fv=t.closest('[data-fav]');if(fv){const id=fv.dataset.fav;
    const on=DB.favs.includes(id);
    DB.favs=on?DB.favs.filter(f=>f!==id):[...DB.favs,id];
    save();render();if(!on)toast('관심 목록에 담았어요 — 내 지점에서 볼 수 있어요');return;}
  const bp=t.closest('[data-bump]');if(bp){const p=post(bp.dataset.bump);
    p.ts=now();p.bumps=(p.bumps||0)+1;
    const b=BOTS[Math.floor(Math.random()*BOTS.length)].n;   /* 끌올하면 가상 지점이 다시 봄 */
    sched(6000+Math.random()*7000,p.kind==='give'?'botAsk':'botOffer',p.id,{bot:b});
    save();render();toast('끌어올렸어요 — 가상 지점들이 다시 봅니다');return;}
  if(t.id==='resetAll'){if(confirm('체험 데이터를 모두 지울까요?')){localStorage.removeItem(KEY);location.hash='#home';location.reload();}return;}
  const A=k=>t.closest(`[data-${k}]`)?.dataset[k];
  const ask=A('ask');if(ask){const p=post(ask);
    p.comments.push({br:meBr(),txt:'저희 지점 필요합니다. 신청드려요.',ts:now(),ask:true});
    sched(5000+Math.random()*6000,'botAccept',p.id);save();render();toast('신청 완료 — 상대 지점의 확정을 기다립니다');return;}
  const off=A('offer');if(off){const p=post(off);p.state='matchedOut';p.peer=p.br;p.sender=meBr();
    p.comments.push({br:meBr(),txt:'저희 창고에 여분 있어요. 보내드릴게요.',ts:now()});
    save();render();toast('매칭 완료 — 발송 등록을 눌러 행낭에 실어주세요');return;}
  const send=A('send');if(send){const p=post(send);p.state='matchedOut';p.peer=t.closest('[data-to]').dataset.to;
    p.comments.push({br:meBr(),txt:`${p.peer} 수신 확정입니다. 발송 등록하겠습니다.`,ts:now()});
    save();render();toast(`${p.peer} 수신 확정 — 발송 등록을 눌러주세요`);return;}
  const ship=A('ship');if(ship){const p=post(ship);p.state='shippedOut';
    sched(DAY_MS,'shipOut',p.id);save();render();
    toast('행낭 발송 등록 — 내일 아침 도착 (체험에서는 약 30초)');return;}
  const recv=A('recv');if(recv){const p=post(recv);p.state='thanks';DB.recv++;
    const b=botOf(p.peer||p.br);if(b)b.t=Math.round((b.t+0.2)*10)/10;
    bump(0.2,'수령 확인 — 보낸 지점도 +0.2°');save();render();return;}
  const thx=A('thx');if(thx){const p=post(thx);const txt=THX[+t.dataset.i];
    p.state='closed';p.comments.push({br:meBr(),txt:txt+' (감사 카드)',ts:now()});
    bump(0.1,'감사 카드 전송');
    if(!isMine(p))sched(4000,'botReply',p.id,{bot:p.peer||p.br,txt:'따뜻한 카드 감사합니다. 다음에 또 나눠요.'});
    save();render();return;}
  const cm=A('cm');if(cm&&t.dataset.cm){const p=post(cm);const inp=$('#cmIn');const txt=inp.value.trim();
    if(!txt)return;
    p.comments.push({br:meBr(),txt,ts:now()});
    if(!isMine(p))sched(6000+Math.random()*6000,'botReply',p.id,{bot:p.br,txt:'네, 확인했습니다.'});
    save();render();return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){fQ=e.target.value;   /* trim은 필터 비교에서만 — IME·공백 보존 */
    clearTimeout(window._qT);window._qT=setTimeout(render,250);}
  if(e.target.id==='wTitle')wTitleV=e.target.value;
  if(e.target.id==='wDesc')wDescV=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cmIn'){e.target.nextElementSibling?.click();}
  if(e.key==='Enter'&&e.target.id==='kwIn'){e.preventDefault();$('#kwGo')?.click();}
});

/* ── 부팅 ── */
$('#ff').innerHTML=IC_FF+'<span style="margin-left:2px">행낭 빨리감기</span> <span id="ffn"></span>';
load();paintMe();paintBell();
if(!DB.me)onboard();
ensureBotPost();
route();
setInterval(tick,1000);
</script>
</body>
